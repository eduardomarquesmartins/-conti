<!DOCTYPE html><html lang="pt-BR"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Admin - Gerenciador de Presentes</title>    <style>        body {            font-family: 'Segoe UI', sans-serif;            background-color: #f3f4f6;            color: #1f2937;            padding: 20px;        }        .container {            max-width: 900px;            margin: 0 auto;            background: white;            padding: 20px;            border-radius: 8px;            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);        }        h1 {            margin-bottom: 20px;        }        .form-group {            margin-bottom: 15px;        }        label {            display: block;            margin-bottom: 5px;            font-weight: bold;        }        input {            width: 100%;            padding: 8px;            border: 1px solid #d1d5db;            border-radius: 4px;        }        .btn {            padding: 10px 15px;            background-color: #2A6E78;            color: white;            border: none;            border-radius: 4px;            cursor: pointer;            font-size: 1rem;            transition: background 0.2s;        }        .btn:hover {            background-color: #1f555d;        }        .btn-delete {            background-color: #ef4444;            margin-left: auto;        }        .item-list {            margin-top: 30px;            border-top: 2px solid #e5e7eb;            padding-top: 20px;        }        .gift-item {            display: flex;            align-items: center;            background: #fff;            border: 1px solid #e5e7eb;            padding: 10px;            margin-bottom: 10px;            border-radius: 6px;            gap: 15px;        }        .gift-img {            width: 50px;            height: 50px;            object-fit: cover;            border-radius: 4px;            background: #eee;        }        .gift-info {            flex: 1;        }        .gift-title {            font-weight: bold;        }        .output-area {            margin-top: 30px;            background: #111827;            color: #10b981;            padding: 15px;            border-radius: 6px;            font-family: monospace;            white-space: pre-wrap;            overflow-x: auto;            display: none;        }        .info-box {            background-color: #dbeafe;            padding: 10px;            border-radius: 4px;            margin-bottom: 20px;            border-left: 4px solid #3b82f6;        }        /* Estilos da Galeria de Imagens */        .image-gallery {            display: grid;            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));            gap: 10px;            max-height: 250px;            overflow-y: auto;            border: 1px solid #d1d5db;            padding: 10px;            border-radius: 4px;            background: #fff;        }        .gallery-item {            cursor: pointer;            border: 2px solid transparent;            border-radius: 4px;            overflow: hidden;            height: 80px;            background: #f0f0f0;            display: flex;            /* Centralizar loading */            align-items: center;            justify-content: center;            font-size: 10px;            color: #999;        }        .gallery-item img {            width: 100%;            height: 100%;            object-fit: cover;            display: block;        }        .gallery-item:hover {            border-color: #9ca3af;        }        .gallery-item.selected {            border-color: #2A6E78;            box-shadow: 0 0 0 2px #2A6E78 inset;        }        .selected-preview {            margin-top: 10px;            font-size: 0.9em;            color: #666;            display: flex;            align-items: center;            gap: 10px;        }        .preview-thumb {            width: 40px;            height: 40px;            object-fit: cover;            border-radius: 4px;            border: 1px solid #ccc;        }    </style></head><body>    <div class="container">        <h1>Gerenciador de Presentes 🎁</h1>        <div class="info-box">            <strong>Modo Inteligente Ativado:</strong>            O sistema salva sua lista automaticamente e procura novas fotos do <code>meme1</code> até o            <code>meme100</code>.        </div>        <div style="background: #f9fafb; padding: 15px; border-radius: 6px; margin-bottom: 20px;">            <h3>Adicionar Novo Item</h3>            <div class="form-group">                <label>Título do Presente</label>                <input type="text" id="title" placeholder="Ex: Geladeira Nova">            </div>            <div class="form-group">                <label>Valor (R$)</label>                <input type="number" id="price" placeholder="Ex: 500.00">            </div>            <div class="form-group">                <label>Escolha uma Imagem (buscando até meme100.jpg):</label>                <div class="image-gallery" id="gallery">                    <div style="padding:10px;">Carregando galeria...</div>                </div>                <div class="selected-preview" id="selected-preview">                    Nenhuma imagem selecionada.                </div>                <input type="hidden" id="image-path">            </div>            <button class="btn" onclick="addItem()">+ Adicionar Presente</button>        </div>        <h3>Lista Atual (<span id="count">0</span>)</h3>        <div id="list" class="item-list">        </div>        <div style="margin-top: 30px; text-align: right; display: flex; gap: 10px;">            <button class="btn" style="background-color: #6b7280;" onclick="clearMemory()">Resetar Memória                (Zerar)</button>            <button class="btn" style="background-color: #059669; flex: 1;" onclick="generateCode()">GERAR CÓDIGO                FINAL</button>        </div>        <div id="output" class="output-area"></div>    </div>    <script src="gifts.js"></script>    <script>        // ==========================================        // PERSISTÊNCIA (Carregar Memória)        // ==========================================        const savedData = localStorage.getItem('weddingGiftList');        // Prioridade: 1. Memória do Navegador | 2. Arquivo JS | 3. Lista Vazia        let currentList = savedData ? JSON.parse(savedData) : ((typeof giftList !== 'undefined' && giftList.length > 0) ? giftList : []);        // Config da Galeria        const maxScan = 100; // Tenta procurar até o meme100        let selectedImage = '';        // ==========================================        // GALERIA INTELIGENTE        // ==========================================        function renderGallery() {            const gallery = document.getElementById('gallery');            gallery.innerHTML = '';            const possibleImages = ['assets/casal_silhouette.png'];            // Gera lista de possibilidades            for (let i = 1; i <= maxScan; i++) {                possibleImages.push(`assets/meme${i}.jpg`);            }            possibleImages.forEach(path => {                const div = document.createElement('div');                div.className = 'gallery-item';                div.onclick = () => selectImage(path, div);                div.style.display = 'none'; // Começa invisível                const img = document.createElement('img');                img.loading = "lazy"; // Melhora performance                img.onload = function () {                    img.style.display = 'block';                    div.style.display = 'block'; // Aparece só se carregar com sucesso                };                img.onerror = function () {                    div.remove(); // Remove do DOM se não existir                };                img.src = path; // Start loading                img.alt = path.split('/').pop();                div.appendChild(img);                gallery.appendChild(div);            });        }        function selectImage(path, element) {            selectedImage = path;            document.getElementById('image-path').value = path;            // Atualiza visual            document.querySelectorAll('.gallery-item').forEach(el => el.classList.remove('selected'));            element.classList.add('selected');            // Mostra preview            const preview = document.getElementById('selected-preview');            preview.innerHTML = `            <img src="${path}" class="preview-thumb">            <span>Selecionado: <b>${path}</b></span>        `;        }        // ==========================================        // GERENCIAMENTO DA LISTA        // ==========================================        function saveToBrowser() {            localStorage.setItem('weddingGiftList', JSON.stringify(currentList));        }        function renderList() {            const listEl = document.getElementById('list');            const countEl = document.getElementById('count');            listEl.innerHTML = '';            countEl.textContent = currentList.length;            currentList.forEach((item, index) => {                const el = document.createElement('div');                el.className = 'gift-item';                el.innerHTML = `                <img src="${item.image}" class="gift-img" onerror="this.src='https://placehold.co/50'">                <div class="gift-info">                    <div class="gift-title">${item.title}</div>                    <div>R$ ${parseFloat(item.price).toFixed(2)}</div>                </div>                <button class="btn btn-delete" onclick="removeItem(${index})">Excluir</button>            `;                listEl.appendChild(el);            });            saveToBrowser();        }        function addItem() {            const title = document.getElementById('title').value;            const price = document.getElementById('price').value;            const image = document.getElementById('image-path').value;            if (!title || !price) {                alert("Preencha título e valor!");                return;            }            if (!image) {                alert("Selecione uma imagem da galeria!");                return;            }            currentList.push({                id: Date.now(),                title: title,                price: parseFloat(price),                image: image            });            // Limpa form            document.getElementById('title').value = '';            document.getElementById('price').value = '';            // Reseta imagem (Opcional: se quiser manter a seleção, comente as linhas abaixo)            selectedImage = '';            document.getElementById('image-path').value = '';            document.getElementById('selected-preview').innerHTML = 'Nenhuma imagem selecionada.';            document.querySelectorAll('.gallery-item').forEach(el => el.classList.remove('selected'));            renderList();        }        function removeItem(index) {            if (confirm('Remover item?')) {                currentList.splice(index, 1);                renderList();            }        }        function clearMemory() {            if (confirm('ATENÇÃO: Isso vai apagar a lista salva no seu navegador e você vai perder o que não tiver copiado para o gifts.js!')) {                localStorage.removeItem('weddingGiftList');                location.reload();            }        }        function generateCode() {            const jsonContent = JSON.stringify(currentList, null, 4);            const fileContent = `// LISTA DE PRESENTES - Gerado pelo Admin// Cole este conteúdo no arquivo gifts.jsvar giftList = ${jsonContent};`;            const out = document.getElementById('output');            out.textContent = fileContent;            out.style.display = 'block';            window.scrollTo(0, document.body.scrollHeight);            alert("Código gerado! Copie o texto preto e cole no arquivo 'gifts.js'");        }        // Inicialização        renderGallery();        renderList();    </script></body></html>
